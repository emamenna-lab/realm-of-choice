name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4
      - name: Scarica Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
      - name: Importa il progetto
        run: ./godot --headless --path . --import
      - name: Test
        run: ./godot --headless --path . -s tests/run_tests.gd
      - name: Simulazione di bilanciamento
        run: ./godot --headless --path . -s tools/simulate.gd -- 1000
