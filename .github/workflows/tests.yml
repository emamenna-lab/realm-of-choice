name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4
      - name: Scarica Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
      - name: Importa il progetto
        run: ./godot --headless --path . --import
      - name: Test
        run: |
          ./godot --headless --path . -s tests/run_tests.gd 2>&1 | tee tests.log
          grep -q " 0 verifiche fallite" tests.log
          ! grep -q "SCRIPT ERROR" tests.log
      - name: Simulazione di bilanciamento
        run: ./godot --headless --path . -s tools/simulate.gd -- 1000
      - name: Percorso dell'interfaccia
        timeout-minutes: 3
        run: |
          ./godot --headless --path . -s tools/ui_smoke.gd 2>&1 | tee ui.log
          grep -q "UI percorsa" ui.log
          ! grep -q "SCRIPT ERROR" ui.log
